# Alembic database migration config.
# Usage (from backend/):
#   alembic revision --autogenerate -m "baseline"
#   alembic upgrade head
#   alembic stamp head       # for existing DB, mark current as applied
#
# NOTE: keep this file ASCII-only. Alembic reads it with locale encoding
# (GBK on Chinese Windows) and non-ASCII bytes here would crash configparser.
# Real DATABASE_URL is resolved in migrations/env.py from app.config.settings.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
