# ══════════════════════════════════════════════════════════════════
# 智研星枢 生产编排：nginx → app×N → PostgreSQL + Redis
# 用法（在 deploy/ 目录）：
#   cp .env.example .env   填 SECRET_KEY / QWEN_API_KEY / POSTGRES_PASSWORD
#   docker compose up -d --build
#   横向扩容（应用层无状态，限流/锁定/并发闸都在 Redis）：
#   docker compose up -d --scale app=3
# ══════════════════════════════════════════════════════════════════
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zhixing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必填}
      POSTGRES_DB: zhixing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhixing"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 限流计数/租约允许丢；登录锁定等状态短 TTL，无需重持久化
    command: redis-server --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # 若直连 Docker Hub / 官方 npm、pypi 慢，构建时传参改镜像源（无需改本文件）：
      #   docker compose build --build-arg NODE_IMAGE=docker.1ms.run/library/node:20-alpine `
      #     --build-arg PY_IMAGE=docker.1ms.run/library/python:3.12-slim `
      #     --build-arg NPM_REGISTRY=https://registry.npmmirror.com `
      #     --build-arg PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/ app
    env_file: .env
    environment:
      # 容器内环境变量优先级高于 env_file，这里强制指向集群服务
      DEBUG: "False"
      DATABASE_URL: postgresql+asyncpg://zhixing:${POSTGRES_PASSWORD}@db:5432/zhixing
      REDIS_URL: redis://redis:6379/0
    volumes:
      - generated:/app/backend/generated
      - uploads:/app/backend/uploads
      - logs:/app/backend/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    # 水平扩展提示：--scale app=3 即可，nginx 通过 compose DNS 自动轮询所有副本

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  generated:
  uploads:
  logs:
