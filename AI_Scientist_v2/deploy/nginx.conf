# 智研星枢 生产反代：静态由后端容器直供（SPA 构建产物已打进镜像），这里只做转发
# 多副本时 compose 内置 DNS 会对 app 服务轮询，天然负载均衡
upstream zhixing_app {
    server app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 上传课件/电子书的体积上限（与后端 MAX_UPLOAD_SIZE_MB 对齐，留余量）
    client_max_body_size 30m;

    # AI 长任务（专家模式/生成）响应慢，读超时放宽
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://zhixing_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端限流按 X-Forwarded-For 首段取真实客户端 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式推送必须关缓冲，否则打字机效果变成整段蹦出
        proxy_buffering off;
        proxy_cache off;
    }
}

