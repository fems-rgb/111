# 智研星枢 生产反代：静态由后端容器直供（SPA 构建产物已打进镜像），这里只做转发
# 多副本：用变量式 proxy_pass + Docker 内嵌 DNS，使 nginx 运行时按 TTL 重新解析 app，
# 从而在 `--scale app=N` 后自动纳入新副本（静态 upstream 主机名只在启动时解析一次，做不到）

server {
    listen 80;
    server_name _;

    # Docker 内嵌 DNS 服务器 127.0.0.11；valid=10s 控制重新解析频率，ipv6=off 避免 AAAA 干扰
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_app app;

    # 上传课件/电子书的体积上限（与后端 MAX_UPLOAD_SIZE_MB 对齐，留余量）
    client_max_body_size 30m;

    # AI 长任务（专家模式/生成）响应慢，读超时放宽
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        # 变量式 proxy_pass 才会触发每次按 DNS 轮询重新解析（代价：无法复用 upstream keepalive）
        proxy_pass http://$upstream_app:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端限流按 X-Forwarded-For 首段取真实客户端 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式推送必须关缓冲，否则打字机效果变成整段蹦出
        proxy_buffering off;
        proxy_cache off;
    }
}

