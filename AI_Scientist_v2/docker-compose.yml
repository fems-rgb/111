# ============================================================
# 智研星枢 - 本地一键起服务
# 用法（在项目根 AI_Scientist_v2/）：
#   docker compose up --build
# 访问：
#   前端 http://localhost:5173
#   API  http://localhost:8000/docs
# ============================================================
version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: zhixing-backend:3.0.0
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/zhixing.db
    ports:
      - '8000:8000'
    volumes:
      - zhixing-data:/app/data
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads
      - ./backend/output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build && npx --yes serve -s dist -l 5173"
    environment:
      VITE_API_BASE: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - '5173:5173'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  zhixing-data:
  frontend-node-modules:
