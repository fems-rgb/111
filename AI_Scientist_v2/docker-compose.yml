# ============================================================
# 智研星枢 - 一键起服务（单容器模式）
# 用法（在项目根 AI_Scientist_v2/）：
#   docker compose up --build
# 访问：
#   http://localhost:8000       ← 前端 SPA（由 backend/static 提供）
#   http://localhost:8000/docs  ← API Swagger
# ============================================================
version: '3.9'

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: zhixing-backend:3.0.0
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/zhixing.db
      DEBUG: "False"
    ports:
      - '8000:8000'
    volumes:
      - zhixing-data:/app/data
      - ./backend/uploads:/app/uploads        # 用户上传原件
      - ./backend/generated:/app/generated    # 生成文件唯一根目录（固定）
      - ./backend/output:/app/output          # 历史产物（只读兼容）
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  zhixing-data:
